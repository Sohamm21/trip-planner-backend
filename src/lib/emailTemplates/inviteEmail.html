<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voyage Invite</title></head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f5;padding:40px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background:#111827;padding:24px;text-align:center;">
              <h1 style="margin:0;color:#ffffff;font-size:28px;">Voyage</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:40px 32px;">
              <h2 style="margin:0 0 20px;color:#111827;font-size:24px;">You're invited! ✈️</h2>
              <p style="margin:0 0 16px;color:#4b5563;font-size:16px;line-height:1.6;">
                <strong>{{inviterName}}</strong> has invited you to collaborate on the trip
                <strong>"{{tripName}}"</strong> as a <strong>{{role}}</strong>.
              </p>
              <p style="margin:0 0 30px;color:#4b5563;font-size:16px;line-height:1.6;">
                Log in to Voyage to accept or decline this invite.
              </p>
              <div style="text-align:center;margin-bottom:10px;">
                <a href="{{frontendUrl}}" style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;padding:14px 28px;border-radius:8px;font-weight:bold;">
                  Open Voyage
                </a>
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:24px;background:#f9fafb;text-align:center;">
              <p style="margin:0;color:#9ca3af;font-size:13px;">© 2026 Voyage. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body></html>
